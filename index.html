<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agility United</title>


    <!-- GOOGLE FONT -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="index.css"
    >

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background-lines"></div>

    <div class="orange-glow glow-top"></div>

    <div class="orange-glow glow-bottom"></div>


    <!-- HERO -->

    <main class="hero">


        <!-- LOGO -->

        <div class="logo-wrapper">

            <div class="logo-ring">

                <img
                    src="assets/logo.png"
                    alt="Agility United Logo"
                    class="logo"
                >

            </div>

        </div>


        <!-- TITLE -->

        <div class="hero-content">


            <div class="title-wrapper">

                <h1>

                    <span class="title-agility">
                        AGILITY
                    </span>

                    <span class="title-united">
                        UNITED
                    </span>

                </h1>

            </div>


            <!-- SLOGAN -->

            <p class="slogan">

                MORE THAN A CLAN

            </p>


            <!-- ORANGE LINE -->

            <div class="accent-line"></div>


            <!-- DESCRIPTION -->

            <p class="hero-description">

                One Clan. One Family. One Goal.

            </p>


            <!-- BUTTON -->

            <a
                href="about.html"
                class="explore-button"
            >

                <span>
                    Explore Our Club
                </span>

                <span class="arrow">
                    →
                </span>

            </a>


        </div>


        <!-- SCROLL TEXT -->

        <div class="scroll-text">

            <span></span>

            EXPLORE AGILITY UNITED

        </div>


    </main>


</body>

</html>
