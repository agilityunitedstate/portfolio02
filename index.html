<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agility United | More Than A Clan</title>


    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="index.css"
    >

</head>


<body>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="background-grid"></div>

    <div class="background-lines"></div>

    <div class="orange-glow glow-one"></div>

    <div class="orange-glow glow-two"></div>


    <!-- =========================================
         MAIN HERO
    ========================================== -->

    <main class="hero">


        <!-- TOP BRAND -->

        <div class="top-brand">

            <span class="brand-dot"></span>

            AGILITY UNITED

        </div>


        <!-- HERO CONTENT -->

        <section class="hero-content">


            <!-- LOGO -->

            <div class="logo-area">

                <div class="logo-ring ring-one"></div>

                <div class="logo-ring ring-two"></div>


                <div class="logo-box">

                    <img
                        src="assets/logo.png"
                        alt="Agility United Logo"
                    >

                </div>

            </div>


            <!-- SMALL TEXT -->

            <p class="welcome-text">

                WELCOME TO

            </p>


            <!-- TITLE -->

            <h1>

                <span class="title-white">

                    AGILITY

                </span>

                <span class="title-orange">

                    UNITED

                </span>

            </h1>


            <!-- SLOGAN -->

            <div class="slogan-container">

                <span class="line"></span>

                <p>

                    MORE THAN A CLAN

                </p>

                <span class="line"></span>

            </div>


            <!-- DESCRIPTION -->

            <p class="description">

                A community built by passion, teamwork,
                friendship, and one shared goal.

            </p>


            <!-- BUTTON -->

            <a
                href="about.html"
                class="explore-button"
            >

                <span class="button-text">

                    Explore Our Club

                </span>


                <span class="button-icon">

                    →

                </span>

            </a>


            <!-- BOTTOM INFO -->

            <div class="club-values">


                <div class="value">

                    <span class="value-number">

                        01

                    </span>

                    <p>

                        ONE CLAN

                    </p>

                </div>


                <div class="value-divider"></div>


                <div class="value">

                    <span class="value-number">

                        02

                    </span>

                    <p>

                        ONE FAMILY

                    </p>

                </div>


                <div class="value-divider"></div>


                <div class="value">

                    <span class="value-number">

                        03

                    </span>

                    <p>

                        ONE GOAL

                    </p>

                </div>


            </div>


        </section>


        <!-- SIDE TEXT -->

        <div class="side-text">

            AGILITY UNITED
            <span></span>
            EST. 2022

        </div>


        <!-- BOTTOM SCROLL -->

        <div class="scroll-down">

            <span class="scroll-line"></span>

            <p>

                SCROLL TO EXPLORE

            </p>

        </div>


    </main>


</body>

</html>
