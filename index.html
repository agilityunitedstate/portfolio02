<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agility United | More Than A Clan</title>


    <!-- GOOGLE FONT -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>


    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="index.css"
    >

</head>


<body>


    <!-- ========================================
         BACKGROUND EFFECT
    ========================================= -->

    <div class="background-lines"></div>

    <div class="background-glow glow-one"></div>

    <div class="background-glow glow-two"></div>


    <!-- ========================================
         MAIN LANDING PAGE
    ========================================= -->

    <main class="hero">


        <!-- LOGO -->

        <div class="logo-container">

            <div class="logo-circle">

                <img
                    src="assets/logo.png"
                    alt="Agility United Logo"
                    class="agility-logo"
                >

            </div>

        </div>


        <!-- CLUB NAME -->

        <section class="hero-title">


            <h1>

                <span class="agility">
                    AGILITY
                </span>

                <span class="united">
                    UNITED
                </span>

            </h1>


            <!-- SLOGAN -->

            <p class="slogan">

                MORE THAN A CLAN

            </p>


            <!-- LINE -->

            <div class="title-line"></div>


        </section>


        <!-- EXPLORE BUTTON -->

        <a
            href="about.html"
            class="explore-button"
        >

            <span>
                Explore Our Club
            </span>

            <span class="button-arrow">
                →
            </span>

        </a>


        <!-- SMALL TEXT -->

        <p class="hero-footer">

            ONE CLAN • ONE FAMILY • ONE GOAL

        </p>


    </main>


</body>

</html>
